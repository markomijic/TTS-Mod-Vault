targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: false
          generate_connect_constructor: false
      freezed:
        options:
          # Keep generated code small; we rarely need these.
          when: false
          map: false
          copy_with: true
          equal: true
          to_string: true
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: none
